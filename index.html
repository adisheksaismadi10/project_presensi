<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PPM AFM Presensi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: aplikasi satu kolom, tab peran di atas, daftar besar untuk HP, tabel heatmap yang bisa digeser untuk guru. */
:root{
  --bg:#F5F7EE; --surface:#FFFFFF; --surface2:#EBEFDF; --fg:#18200F; --muted:#59644C; --line:#D9DFCA;
  --accent:#4F6F00; --accent-fg:#FFFFFF; --lime:#A0D800; --glow:rgba(160,216,0,.16); --brass:#9A6A14;
  --good-bg:#D8EDDD; --good-fg:#13502A; --warn-bg:#F7E6B3; --warn-fg:#664500;
  --bad-bg:#F5D2CC; --bad-fg:#86200F; --info-bg:#D4E5F4; --info-fg:#16426C; --cuti-bg:#E6DEF5; --cuti-fg:#3F2A72;
  --shadow:0 1px 2px rgba(24,32,15,.08),0 10px 28px rgba(24,32,15,.08);
  --f-display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10150B; --surface:#181F10; --surface2:#222B17; --fg:#ECF1E2; --muted:#A3B08F; --line:#2E3A20;
    --accent:#A0D800; --accent-fg:#1A2400; --glow:rgba(160,216,0,.10); --brass:#D9A441;
    --good-bg:#16402A; --good-fg:#A8E6BE; --warn-bg:#4A3A0E; --warn-fg:#F2D88A;
    --bad-bg:#52201B; --bad-fg:#F5B5AD; --info-bg:#1B3550; --info-fg:#A9CDEE; --cuti-bg:#2D2551; --cuti-fg:#CDBFF2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10150B; --surface:#181F10; --surface2:#222B17; --fg:#ECF1E2; --muted:#A3B08F; --line:#2E3A20;
  --accent:#A0D800; --accent-fg:#1A2400; --glow:rgba(160,216,0,.10); --brass:#D9A441;
  --good-bg:#16402A; --good-fg:#A8E6BE; --warn-bg:#4A3A0E; --warn-fg:#F2D88A;
  --bad-bg:#52201B; --bad-fg:#F5B5AD; --info-bg:#1B3550; --info-fg:#A9CDEE; --cuti-bg:#2D2551; --cuti-fg:#CDBFF2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 360px at 50% -120px,var(--glow),transparent),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding:16px 16px 96px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin-bottom:12px}
.head p{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(24,32,15,.04)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:.78rem;font-weight:500}
.stat b{font-family:var(--f-display);font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:.78rem;color:var(--muted)}
.stat b,.stat em{display:block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;transition:background .15s,transform .06s,box-shadow .15s}
.btn:hover{box-shadow:0 1px 6px rgba(24,32,15,.12)}
.btn:active,.row:active,.chip:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.warn{background:var(--bad-bg);color:var(--bad-fg);border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.bar-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-bottom:12px}
.bar-row .field{flex:1 1 180px}
/* absen */
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sum div{border-radius:10px;padding:8px 6px;text-align:center;font-size:.76rem;font-weight:600}
.sum b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.s-H{background:var(--good-bg);color:var(--good-fg)}
.s-I{background:var(--info-bg);color:var(--info-fg)}
.s-S{background:var(--warn-bg);color:var(--warn-fg)}
.s-A{background:var(--bad-bg);color:var(--bad-fg)}
.s-C{background:var(--cuti-bg);color:var(--cuti-fg)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;min-height:58px}
.row .no{width:26px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;flex:none}
.row .nm{flex:1;min-width:0;font-weight:600}
.row .nm small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.pill{flex:none;min-width:84px;text-align:center;border-radius:9px;padding:9px 10px;font-weight:700;font-size:.9rem}
.row.locked{background:var(--surface2)}
.row.off{cursor:default}
.actbar{position:sticky;bottom:0;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.actbar p{font-size:.88rem;min-width:0;flex:1 1 200px}
.note{font-size:.84rem;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;font-size:.9rem}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.bad{background:var(--bad-bg);color:var(--bad-fg)}
.banner.good{background:var(--good-bg);color:var(--good-fg)}
.banner.info{background:var(--info-bg);color:var(--info-fg)}
/* heatmap */
.hmwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.hm{border-collapse:separate;border-spacing:0;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
.hm th,.hm td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.hm thead th{position:sticky;top:0;background:var(--surface2);z-index:2;font-size:.74rem;white-space:normal;min-width:70px;vertical-align:bottom}
.hm th:first-child,.hm td:first-child{position:sticky;left:0;text-align:left;background:var(--surface);z-index:1;min-width:150px;max-width:170px;white-space:normal}
.hm thead th:first-child{z-index:3;background:var(--surface2)}
.hm td:first-child button{background:none;border:0;padding:0;text-align:left;font-weight:600;line-height:1.25}
.hm td:first-child small{display:block;color:var(--muted);font-weight:500}
.hm td.g{background:var(--good-bg);color:var(--good-fg)}
.hm td.w{background:var(--warn-bg);color:var(--warn-fg)}
.hm td.b{background:var(--bad-bg);color:var(--bad-fg);font-weight:700}
.hm td.tot{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.attn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.attn:last-child{border-bottom:0}
.attn .who{flex:1;min-width:0;font-weight:600}
.attn .who small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.num{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700}
/* bars */
.meter{display:grid;grid-template-columns:minmax(96px,150px) 1fr 44px;gap:10px;align-items:center;font-size:.88rem;padding-block:5px}
.track{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.fill.g{background:var(--good-fg)} .fill.w{background:var(--brass)} .fill.b{background:var(--bad-fg)}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-weight:800;font-size:4.2rem;line-height:1;font-variant-numeric:tabular-nums}
.ortu{font-size:1.05rem}
.ortu .btn{min-height:52px;font-size:1.02rem}
.trend{display:flex;align-items:flex-end;gap:12px;height:140px;padding-top:8px}
.trend div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:.8rem;font-variant-numeric:tabular-nums}
.trend i{display:block;width:100%;max-width:56px;border-radius:8px 8px 2px 2px;background:var(--accent)}
.trend i.cur{background:var(--brass)}
table.plain{width:100%;border-collapse:collapse;font-size:.9rem}
.plain th,.plain td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.plain th{font-size:.76rem;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.scroll .plain{min-width:520px}
.scroll .plain td{vertical-align:top}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
label.row{cursor:pointer}
.row.dis{opacity:.6;cursor:not-allowed}
/* header */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin-inline:auto;padding:8px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:auto;flex:none;display:block}
.brand b{font-family:var(--f-display);font-size:1.2rem;display:block;line-height:1.05;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:.74rem}
.bar-r{display:flex;align-items:center;gap:8px;min-width:0}
.uname{font-size:.85rem;font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtag{background:var(--surface2);border-radius:99px;padding:5px 12px;font-size:.78rem;font-weight:700;white-space:nowrap}
.bar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:36px;padding:4px 8px;font-weight:600;font-size:.85rem}
.demo{font-size:.76rem;color:var(--muted);margin-bottom:12px}
@media (max-width:560px){.uname{display:none}.brand span{display:none}}
/* login */
.login{max-width:430px;margin:3vh auto 0;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero img{width:96px;height:auto}
.hero h1{font-size:2rem;letter-spacing:.03em}
.hero p{color:var(--muted);font-size:.92rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:44px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(24,32,15,.14)}
.demo-box{border-style:dashed;background:transparent;box-shadow:none}
/* sidebar di laptop */
.sideL{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){
  .sideL{display:grid;grid-template-columns:200px minmax(0,1fr);align-items:start;gap:28px}
  .sideL>.side{flex-direction:column;position:sticky;top:76px;overflow:visible;gap:4px}
  .side .chip{border-radius:12px;text-align:left;min-height:44px;border-color:transparent;background:transparent;font-size:.92rem}
  .side .chip:hover{background:var(--surface2)}
  .side .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
}
/* loading */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash img{width:112px;height:auto;animation:rise .7s cubic-bezier(.2,.8,.2,1) both,breathe 2.4s ease-in-out .7s infinite}
.splash b{font-family:var(--f-display);font-size:1.7rem;letter-spacing:.05em;animation:rise .7s .15s both}
.splash span{color:var(--muted);font-size:.85rem;animation:rise .7s .25s both}
.splash .ld{width:120px;height:3px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:16px}
.splash .ld i{display:block;height:100%;width:40%;background:var(--accent);border-radius:99px;animation:slide 1.1s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.cal{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-h span{text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0;background:var(--surface2)}
.cal-g>*{min-height:54px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px;text-align:center;font-size:.8rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface);font-variant-numeric:tabular-nums;color:inherit}
.cal-g>*:nth-child(7n+1){border-left:0}
.cal-g>i{background:var(--surface2);opacity:.5}
.cal-g small{font-size:.66rem;font-weight:500;color:var(--muted);align-self:flex-start}
button.cd{cursor:pointer}
.cd.now{outline:2px solid var(--accent);outline-offset:-2px}
.cd.off{background:var(--surface2);opacity:.55}
.cd.lib{background:var(--surface2);color:var(--muted);font-size:.66rem;font-weight:600}
.cd.fut{color:var(--muted);font-weight:500}
.cd.g{background:var(--good-bg);color:var(--good-fg)}
.cd.w{background:var(--warn-bg);color:var(--warn-fg)}
.cd.b{background:var(--bad-bg);color:var(--bad-fg)}
.cd.s-H,.cd.s-I,.cd.s-S,.cd.s-A,.cd.s-C{border-radius:0}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mnav b{font-family:var(--f-display)}
.btns.tight .btn{flex:0 0 auto}
.scroll .plain.wide{min-width:640px}
.attn{flex-wrap:wrap}
.field textarea{resize:vertical}
.plain select,.fq input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;min-height:40px}
.fq{display:flex;gap:6px;align-items:center;white-space:nowrap}
.fq input{width:64px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(8,14,10,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.veil{align-items:center}.sheet{border-radius:18px}}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (max-width:480px){.big{font-size:3.4rem}.meter{grid-template-columns:minmax(84px,110px) 1fr 40px}.pill{min-width:72px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="splash" id="splash" aria-hidden="true"><img data-logo alt=""><b>PPM AFM</b><span>Presensi pondok</span><div class="ld"><i></i></div></div>
<header class="bar" id="bar"></header>
<div class="wrap">
  <p class="demo">Prototipe dengan data contoh. Tidak ada data asli.</p>
  <main id="view"></main>
</div>
<div id="veil" class="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

function santriOpts(q,skipIzin,g){
  q=(q||'').toLowerCase();var out='';
  for(var l=1;l<=9;l++){
    if(g!==undefined&&LG[l]!==g)continue;
    var m=S.filter(function(x){return x.l===l&&(!skipIzin||!izinNow(x.id))&&x.n.toLowerCase().indexOf(q)>-1});
    if(m.length)out+='<optgroup label="Lorong '+l+(lg(l)==='L'?' (putra)':' (putri)')+'">'+m.map(function(x){return '<option value="'+x.id+'">'+esc(x.n)+' · '+esc(kn(x))+'</option>'}).join('')+'</optgroup>';
  }
  return out||'<option value="">Tidak ada santri yang cocok</option>';
}
function scChips(){
  var el=$('#scDts');if(!el)return;
  var d=st.gd.dts.slice().sort();
  el.innerHTML=d.length?d.map(function(x){return '<button class="chip" data-act="scDtDel" data-d="'+x+'" title="Hapus tanggal">'+fd(x)+' ×</button>'}).join(''):'<span class="note">Belum ada tanggal dipilih.</span>';
}
function scDraft(){
  var G=st.gd,f=$('#scF'),t=$('#scT');
  return {acts:G.sa.slice(),m:G.sm,f:f?f.value:'',t:t?t.value:'',dts:G.dts.slice()};
}
function scPrev(){
  var p=$('#scPrev');if(!p)return;
  var c=scDraft();
  if(!c.acts.length){p.textContent='Pilih kegiatan yang dicutikan.';return}
  if(c.m==='rentang'){
    var d=dn(c.t)-dn(c.f)+1;
    if(isNaN(d)||d<1){p.textContent='Tanggal sampai harus sama atau setelah tanggal dari.';return}
    if(d>366){p.textContent='Rentang terlalu panjang.';return}
  }else if(!c.dts.length){p.textContent='Tambahkan minimal satu tanggal.';return}
  var skip=0;
  var parts=c.acts.map(function(id){
    var a=ACTS.filter(function(x){return x.id===id})[0];
    var n=c.m==='rentang'?datesIn(a,c.f,c.t).length:c.dts.filter(function(x){return onDay(a,x)}).length;
    if(c.m==='tanggal')skip+=c.dts.length-n;
    return a.n+': '+n+' sesi';
  });
  p.textContent=parts.join(', ')+'. Total '+scSesi(c)+' sesi otomatis berstatus Cuti.'+(skip?' '+skip+' pilihan tanggal tidak ada jadwal kegiatannya dan dilewati.':'');
}

   '<div class="field"><label for="izS">Santri</label><select id="izS">'+santriOpts('',true,G.g)+'</select></div></div>'+
   '<div class="bar-row"><div class="field"><label for="izF">Pergi</label><input id="izF" type="date" value="'+T+'"></div>'+
   '<div class="field"><label for="izT">Kembali</label><input id="izT" type="date" value="'+addDays(T,3)+'"></div></div>'+
   '<p class="banner info" id="izPrev"></p>'+
   '<div class="btns"><button class="btn pri" data-act="izinAdd">Simpan SIP</button></div>'+
   '<h3>SIP yang berlaku ('+aktif.length+')</h3>'+

   '</section>'+

   '<div class="bar-row"><div class="field"><label for="scQ">Cari santri</label><input id="scQ" type="search" placeholder="Ketik nama"></div>'+
   '<div class="field"><label for="scS">Santri</label><select id="scS">'+santriOpts('',false,G.g)+'</select></div></div>'+
   '<div><p class="note" style="margin-bottom:6px"><b>Kegiatan yang dicutikan</b> (boleh lebih dari satu)</p><div class="chips" style="flex-wrap:wrap">'+
   ACTS.filter(function(a){return a.on}).map(function(a){return '<button class="chip" aria-pressed="'+(G.sa.indexOf(a.id)>-1)+'" data-act="scAct" data-id="'+a.id+'">'+esc(a.n)+'</button>'}).join('')+'</div></div>'+
   '<div class="field"><label for="scM">Cara memilih hari</label><select id="scM" data-ch="scM"><option value="rentang"'+(G.sm==='rentang'?' selected':'')+'>Dari tanggal sampai tanggal</option><option value="tanggal"'+(G.sm==='tanggal'?' selected':'')+'>Tanggal tertentu saja</option></select></div>'+
   '<div class="bar-row" id="scR"'+(G.sm==='rentang'?'':' hidden')+'><div class="field"><label for="scF">Dari</label><input id="scF" type="date" value="'+T+'"></div><div class="field"><label for="scT">Sampai</label><input id="scT" type="date" value="'+addDays(T,2)+'"></div></div>'+

   '<div class="btns"><button class="btn pri" data-act="scAdd">Simpan cuti</button></div>'+
   '<h3>Cuti tercatat ('+scs.length+')</h3>'+
   (scs.length?'<div class="scroll"><table class="plain"><thead><tr><th>Santri</th><th>Kegiatan</th><th>Hari</th><th>Sesi</th><th></th></tr></thead><tbody>'+scs.map(function(c){return '<tr><td>'+esc(byId(c.sid).n)+'</td><td>'+esc(c.acts.map(actName).join(', '))+'</td><td>'+scHari(c)+'</td><td>'+scSesi(c)+'</td><td><button class="btn sm" data-act="scDel" data-id="'+c.id+'">Batalkan</button></td></tr>'}).join('')+'</tbody></table></div>':'<p class="note">Belum ada cuti tercatat di gedung ini.</p>')+
   '</section></div>';

function izPrev(){
  var f=$('#izF'),t=$('#izT'),p=$('#izPrev');if(!f||!t||!p)return;
  var d=dn(t.value)-dn(f.value)+1;
  p.textContent=(isNaN(d)||d<1)?'Tanggal kembali harus sama atau setelah tanggal pergi.':d>366?'Rentang terlalu panjang.':d+' hari, '+sesi(f.value,t.value)+' sesi kegiatan sesuai jadwal akan otomatis berstatus Izin, dan status keberadaan menjadi tidak di yayasan.';
}

function guruUpdate(){
  var g=st.gr,A=actsOn(),p=g.p,n=S.length||1;
  var away=IZIN.filter(function(z){return T>=z.from&&T<=z.to}).length;
  var hariIni=Math.round(S.filter(function(s){return !izinNow(s.id)}).reduce(function(x,s){return x+Math.min(100,s.base*100+3)},0)/Math.max(1,n-away));
  var mgg=Math.round(S.reduce(function(x,s){return x+totOf(s,1)},0)/n),bln=Math.round(S.reduce(function(x,s){return x+totOf(s,'T')},0)/n);
  $('#gStats').innerHTML=[['Hadir hari ini',hariIni+'%','12 Okt, semua kegiatan'],['Minggu ini',mgg+'%','Minggu 2'],['Bulan ini',bln+'%','1 sampai 12 Okt'],['Di yayasan malam ini',(n-away),away+' santri izin pulang']].map(function(x){return '<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b><em>'+x[2]+'</em></div>'}).join('');
  var weak=S.map(function(s){return {s:s,t:totOf(s,'T')}}).filter(function(x){return x.t<st.thr}).sort(function(a,b){return a.t-b.t});
  var better=S.filter(function(s){return s.sp>0&&totOf(s,'T')>=st.thr});
  $('#gAttn').innerHTML='<h3>Rekomendasi SP bulan ini: '+weak.length+' santri</h3><p class="note" style="margin-bottom:6px">Santri dengan kehadiran bulan ini di bawah '+st.thr+'%, urut dari yang terendah. Tag Naik atau Baru menunjukkan perubahan dari bulan lalu.</p>'+
   (weak.length?weak.map(function(x){var s=x.s,lv=s.sp+1;return '<div class="attn"><div class="who">'+esc(s.n)+'<small>'+(s.g==='L'?'Putra':'Putri')+', '+esc(kn(s))+' · bulan lalu '+(s.sp?'SP '+s.sp:'tidak ada SP')+'</small></div><span class="tag s-A">SP '+lv+'</span><span class="tag '+(s.sp?'s-S':'s-I')+'">'+(s.sp?'Naik':'Baru')+'</span><span class="num">'+x.t+'%</span><button class="btn sm" data-act="det" data-sid="'+s.id+'">Detail</button></div>'}).join(''):'<p class="note">Tidak ada santri di bawah batas bulan ini.</p>')+
   (better.length?'<p class="note" style="margin-top:8px"><b>Membaik bulan ini</b> (SP bulan lalu, sekarang di atas batas): '+better.map(function(s){return esc(s.n)}).join(', ')+'.</p>':'');
  $('#gLeg').innerHTML='<span><i style="background:var(--good-bg)"></i>80% ke atas</span><span><i style="background:var(--warn-bg)"></i>'+st.thr+'% sampai 79%</span><span><i style="background:var(--bad-bg)"></i>Di bawah '+st.thr+'%</span><span>Ketuk nama untuk detail</span>';
  var q=g.q.toLowerCase();
  var rows=S.filter(function(s){return (g.k===''||String(s.k)===g.k)&&(!g.g||s.g===g.g)&&s.n.toLowerCase().indexOf(q)>-1}).map(function(s){return {s:s,t:totOf(s,p)}});
  rows.sort(function(a,b){return g.asc?a.t-b.t:b.t-a.t});
  $('#gTab').innerHTML='<table class="hm"><thead><tr><th>Santri</th><th>Total</th>'+A.map(function(a){return '<th>'+esc(a.n)+'</th>'}).join('')+'</tr></thead><tbody>'+
   rows.map(function(r){return '<tr><td><button data-act="det" data-sid="'+r.s.id+'">'+esc(r.s.n)+'</button><small>'+(r.s.g==='L'?'Putra':'Putri')+', '+esc(kn(r.s))+'</small></td><td class="tot '+cls(r.t)+'">'+r.t+'%</td>'+A.map(function(a){var v=pctOf(r.s,a,p);return '<td class="'+cls(v)+'">'+v+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'+(rows.length?'':'<p class="note" style="padding:12px">Tidak ada santri yang cocok.</p>');
}

function imJk(v){v=String(v||'').trim().toLowerCase();if(['l','lk','laki','laki-laki','putra','pria'].indexOf(v)>-1)return 'L';if(['p','pr','perempuan','putri','wanita'].indexOf(v)>-1)return 'P';return ''}
function imParse(txt){
  var rows=[],seen={};
  txt.split(/\r?\n/).forEach(function(ln){
    if(!ln.trim())return;
    var sep=ln.indexOf('\t')>-1?'\t':(ln.indexOf(';')>-1?';':',');
    var c=ln.split(sep).map(function(x){return x.trim()});
    if(/^id\b/i.test(c[0]))return;
    var r={nis:c[0]||'',n:c[1]||'',g:imJk(c[2]),l:parseInt(String(c[3]||'').replace(/\D/g,''),10),kl:c[4]||'',ang:parseInt(c[5],10),ortu:c[6]||'',hp:c[7]||'',err:[],warn:''};
    if(!r.nis)r.err.push('ID kosong');
    else if(S.concat(ARC).some(function(s){return s.nis===r.nis}))r.err.push('ID sudah terdaftar');
    else if(seen[r.nis])r.err.push('ID dobel di daftar');
    seen[r.nis]=1;
    if(!r.n)r.err.push('Nama kosong');
    if(!r.g)r.err.push('Jenis kelamin harus L atau P');
    if(!(r.l>=1&&r.l<=9))r.err.push('Lorong tidak dikenal');
    r.k=null;
    if(r.kl){var kx=-1;KLS.forEach(function(k,i){if(k.toLowerCase()===r.kl.toLowerCase()||('kelas '+r.kl)===k.toLowerCase())kx=i});if(kx<0)r.err.push('Kelas tidak dikenal');else r.k=kx}
    if(!(r.ang>=2000&&r.ang<=2100))r.err.push('Angkatan tidak valid');
    if(!r.err.length&&lg(r.l)!==r.g)r.warn='Jenis kelamin berbeda dengan gedung lorong';
    rows.push(r);
  });
  return rows;
}

  else if(a==='kSimpan'){var kk=st.ad.k,masuk=0,keluar=0;S.forEach(function(s){var on=!!st.ad.sel[s.id];if(on&&s.k==null){s.k=kk;masuk++}else if(!on&&s.k===kk){s.k=null;keluar++}});st.ad.sel=null;toast(KLS[kk]+' disimpan: '+masuk+' santri masuk, '+keluar+' keluar.');adBody()}
  else if(a==='semBaru'){S.forEach(function(s){s.kp=s.k});logA('Admin','Memulai semester baru');toast('Semester baru dimulai. Kelas disalin jadi riwayat semester lalu. Ubah santri yang pindah lewat daftar.');if(st.ad.tab!=='kelas')st.ad.tab='kelas';adBody()}
  else if(a==='klAdd'){var nk=($('#nkl').value||'').trim();if(!nk){toast('Tulis nama kelas dulu');return}KLS.push(nk);toast('Kelas "'+nk+'" ditambahkan');adBody()}
  else if(a==='day'){var A=ACTS[ai],dd=+el.dataset.d,ix=A.d.indexOf(dd);if(ix>-1)A.d.splice(ix,1);else A.d.push(dd);refreshAct(ai)}
  else if(a==='dtAdd'){var A2=ACTS[ai],val=$('#dt'+ai).value;if(!val){toast('Pilih tanggalnya dulu');return}if(A2.dt.indexOf(val)<0)A2.dt.push(val);refreshAct(ai)}
  else if(a==='dtDel'){var A3=ACTS[ai];A3.dt=A3.dt.filter(function(x){return x!==el.dataset.d});refreshAct(ai)}
  else if(a==='lbAdd'){var A4=ACTS[ai],lv=$('#lb'+ai).value;if(!lv){toast('Pilih tanggalnya dulu');return}if(A4.lb.indexOf(lv)<0)A4.lb.push(lv);logA('Admin','Menandai libur '+A4.n+' pada '+fd(lv));refreshAct(ai)}
  else if(a==='lbDel'){var A5=ACTS[ai];A5.lb=A5.lb.filter(function(x){return x!==el.dataset.d});refreshAct(ai)}
  else if(a==='actAdd'){var nm2=($('#nact').value||'').trim();if(!nm2){toast('Tulis nama kegiatan dulu');return}var na={id:'x'+ACTS.length,n:nm2,m:'hari',d:[],tg:[],dt:[],lb:[],j1:'08:00',j2:'09:00',dini:false,on:true,b:0};ACTS.push(na);S.forEach(function(s){s.p[na.id]=genP(s,na)});toast('Kegiatan "'+nm2+'" ditambahkan. Pilih hari atau tanggalnya.');adBody()}
  else if(a==='pjAdd'){var pn=($('#pjN').value||'').trim();if(!pn){toast('Tulis nama PJ dulu');return}PJS.push({n:pn,a:$('#pjA').value,g:$('#pjG').value});toast('Penugasan PJ ditambahkan');adBody()}
  else if(a==='stAdd'){var x=($('#nst').value||'').trim();toast(x?'Status "'+x+'" ditambahkan (contoh)':'Tulis nama status dulu')}
});
document.addEventListener('change',function(e){
  var el=e.target,c=el.dataset&&el.dataset.ch;if(!c)return;
  if(c==='roleSw'){st.role=el.value;render();window.scrollTo(0,0)}
  else if(c==='pjAct'){st.pj.act=+el.value;st.pj.l=0;pjUpdate()}
  else if(c==='pjDate'){st.pj.d=capD(el.value);pjUpdate()}
  else if(c==='lgDate'){st.lg.d=capD(el.value);st.lg.cek={};lorongView($('#view'))}
  else if(c==='gd'){st.gd.g=+el.value;st.gd.sa=[];st.gd.dts=[];gedungView($('#view'))}
  else if(c==='scM'){st.gd.sm=el.value;$('#scR').hidden=el.value!=='rentang';$('#scDW').hidden=el.value!=='tanggal';scPrev()}
  else if(c==='kalA'){var w=el.dataset.w;calSt(w).a=+el.value;calRefresh(w)}
  else if(c==='gl'){st.gr.k=el.value;guruUpdate()}
  else if(c==='gs'){st.gr.asc=el.value==='1';guruUpdate()}
  else if(c==='gg'){st.gr.g=el.value;guruUpdate()}
  else if(c==='thr'){var v=Math.max(10,Math.min(95,+el.value||50));st.thr=v;el.value=v;toast('Batas SP menjadi '+v+'%. Daftar guru ikut berubah.')}
  else if(c==='izm'){st.izinMode=el.value;toast('Pengaturan SIP disimpan')}
  else if(c==='mode'){ACTS[+el.dataset.i].m=el.value;refreshAct(+el.dataset.i)}
  else if(c==='tgl'){var arr=el.value.split(/[,\s]+/).map(Number).filter(function(n){return n>=1&&n<=31}),u=[];arr.forEach(function(n){if(u.indexOf(n)<0)u.push(n)});u.sort(function(a,b){return a-b});ACTS[+el.dataset.i].tg=u;refreshAct(+el.dataset.i)}
  else if(c==='j1'||c==='j2'){ACTS[+el.dataset.i][c]=el.value;toast('Jam kegiatan disimpan')}
  else if(c==='dini'){ACTS[+el.dataset.i].dini=el.checked;toast('Disimpan')}
  else if(c==='pjg'){PJS[+el.dataset.i].g=el.value;st.pj.l=0;toast('Cakupan PJ diubah: '+glab(el.value))}
  else if(c==='on'){var on=el.checked;if(!on&&actsOn().length<2){el.checked=true;toast('Minimal satu kegiatan harus aktif');return}ACTS[+el.dataset.i].on=on;toast(on?'Kegiatan diaktifkan':'Kegiatan dimatikan, tidak masuk rekap')}
  else if(c==='lgd'){LG[+el.dataset.l]=+el.value;toast('Lorong '+el.dataset.l+' masuk '+GED[+el.value]);adBody()}
  else if(c==='kKel'){st.ad.k=+el.value;kpInit();$('#kp').innerHTML=kpHTML()}
  else if(c==='kChk'){var ks=+el.dataset.sid;if(el.checked)st.ad.sel[ks]=true;else delete st.ad.sel[ks];$('#kpChips').innerHTML=kpChips();$('#kpSum').textContent=kpSum()}
  else if(c==='sdL'){var s=byId(+el.dataset.sid);s.l=+el.value;logA('Admin','Memindahkan '+s.n+' ke Lorong '+s.l);toast(s.n+' pindah ke Lorong '+s.l+(lg(s.l)!==s.g?'. Perhatian: jenis kelamin berbeda dengan gedung lorong ini.':''));sdTable()}
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='pjQ'){st.pj.q=e.target.value;pjUpdate()}
  else if(id==='gQ'){st.gr.q=e.target.value;guruUpdate()}
  else if(id==='sdQ'){st.ad.sq=e.target.value;sdTable()}
  else if(id==='imT')imPreview();
  else if(id==='rqQ'){$('#rqS').innerHTML=reqOpts(e.target.value)}
  else if(id==='izF'||id==='izT')izPrev();
  else if(id==='izQ'){$('#izS').innerHTML=santriOpts(e.target.value,true,st.gd.g)}
  else if(id==='scQ'){$('#scS').innerHTML=santriOpts(e.target.value,false,st.gd.g)}
  else if(id==='scF'||id==='scT')scPrev();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#veil').hidden)closeSheet();
  if(e.key==='Enter'&&(e.target.id==='lgU'||e.target.id==='lgP')){e.preventDefault();var b1=document.querySelector('[data-act=doLogin]');if(b1)b1.click()}
  if(e.key==='Enter'&&e.target.id==='lgK'){e.preventDefault();var b2=document.querySelector('[data-act=doKode]');if(b2)b2.click()}
});
render();
setTimeout(function(){var sp=$('#splash');if(!sp)return;sp.classList.add('out');setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},500)},1200);
})();

</script>
